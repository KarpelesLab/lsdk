[package]
name = "lsdk"
description = "Rust SDK for hardware wallets speaking the BOLOS APDU protocol: HID/WebHID transport, device info, genuine check, app management, firmware updates and app signers"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/KarpelesLab/lsdk"
authors = ["Mark Karpeles"]
homepage = "https://karpeleslab.github.io/lsdk/"
documentation = "https://docs.rs/lsdk"
readme = "README.md"
keywords = ["hardware-wallet", "hid", "webhid", "apdu", "bitcoin"]
categories = ["cryptography::cryptocurrencies", "hardware-support", "wasm"]
exclude = ["/web", "/.github", "/tests"]

[package.metadata.docs.rs]
features = ["full", "serde"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "lsdk"
path = "src/bin/lsdk.rs"
required-features = ["cli"]

[[example]]
name = "elfinfo"
required-features = ["loader"]

[profile.release]
opt-level = "s"
lto = true

[features]
default = ["hid"]
## Native USB HID transport (hidapi)
hid = ["dep:hidapi"]
## Browser WebHID transport (wasm32 only)
webhid = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys", "dep:futures-channel", "dep:futures-util"]
## Offline genuine check (device attestation against pinned issuer keys, no network)
attestation = ["dep:purecrypto", "dep:js-sys", "dep:wasm-bindgen"]
## Dashboard secure channel: secure commands, custom CA, app sideloading
scp = ["attestation", "purecrypto/cipher"]
## Self-hosted seed backup through the Recover protocol (your CA as backup service)
recover = ["scp", "dep:num-bigint", "dep:serde", "dep:serde_json", "serde"]
## App images (ELF / Intel HEX) and sideloading through the secure channel
loader = ["scp"]
## Manager HTTP API client (app catalog, firmware metadata)
manager-api = ["dep:reqwest", "dep:serde", "dep:serde_json", "serde"]
## HSM secure channel over websocket (genuine check, app install/uninstall, firmware)
hsm = ["serde", "dep:serde", "dep:serde_json", "dep:tokio-tungstenite", "dep:futures-util", "dep:tokio", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys", "dep:futures-channel"]
## High level manager operations (requires manager-api + hsm)
manager = ["manager-api", "hsm"]
## Ethereum app client (transactions built with outscript)
eth = ["dep:outscript", "outscript/evm", "dep:num-bigint"]
## Bitcoin app client: wallet policies, PSBT signing (PSBT/tx building via outscript)
btc = ["dep:outscript", "outscript/bitcoin", "dep:purecrypto"]
## Solana app client (transactions built with outscript)
sol = ["dep:outscript", "outscript/solana"]
## All app clients
apps = ["eth", "btc", "sol"]
## Everything usable on native targets
full = ["hid", "manager", "apps", "attestation", "scp", "loader", "recover"]
## JS/wasm-bindgen API used by the web UI (wasm32 only)
wasm = ["webhid", "manager", "apps", "attestation", "scp", "loader", "recover", "serde", "dep:serde-wasm-bindgen"]
## Command line tool (`lsdk` binary)
cli = ["full", "serde", "dep:clap", "tokio/rt", "tokio/macros"]
## Enable serde derives on public data types
serde = ["dep:serde"]

[dependencies]
thiserror = "2"
hex = "0.4"
outscript = { version = "0.2.7", default-features = false, features = ["std"], optional = true }
purecrypto = { version = "0.10", default-features = false, features = ["std", "hash", "hazmat-secp256k1"], optional = true }
num-bigint = { version = "0.4", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }
futures-channel = { version = "0.3.34", optional = true }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", features = ["derive"], optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"], optional = true }
hidapi = { version = "2.6.7", optional = true }
tokio = { version = "1.54.1", features = ["net", "time"], optional = true }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots", "connect"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3.107", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query"], optional = true }
wasm-bindgen = { version = "0.2.130", optional = true }
wasm-bindgen-futures = { version = "0.4.80", optional = true }
web-sys = { version = "0.3.107", features = ["WebSocket", "MessageEvent", "CloseEvent", "Event", "BinaryType", "Window"], optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
