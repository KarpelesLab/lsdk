[workspace]
resolver = "3"
members = ["crates/lsdk", "crates/lsdk-cli", "crates/lsdk-wasm"]
default-members = ["crates/lsdk", "crates/lsdk-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KarpelesLab/lsdk"
authors = ["Mark Karpeles"]

[workspace.dependencies]
lsdk = { path = "crates/lsdk", default-features = false }

[profile.release.package.lsdk-wasm]
opt-level = "s"
